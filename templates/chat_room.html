<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="user-info">
                <h3>Welcome, {{ current_user.username }}</h3>
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
            <div class="users-list">
                <h4>Online Users <span class="online-count" id="onlineCount">0</span></h4>
                <div id="users">
                    {% for user in users %}
                        <div class="user-item" data-user-id="{{ user.id }}" data-username="{{ user.username }}">
                            <div class="user-avatar">{{ user.username|first|upper }}</div>
                            <div class="user-details">
                                <span class="username">{{ user.username }}</span>
                                <span class="status offline">Offline</span>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h3>Select a user to start chatting</h3>
            </div>
            <div class="messages-container" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="message-input-area" style="display: none;">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
    <script>
    const currentUserId = {{ current_user.id }};
    let selectedUserId = null;
    let lastMessageId = 0;
    let pollingInterval = null;
    
    // Update online status every 30 seconds
    function updateOnlineStatus() {
        fetch('/api/update_status/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        });
    }
    
    // Check online users every 5 seconds
    function checkOnlineUsers() {
        fetch('/api/check_status/')
            .then(response => response.json())
            .then(data => {
                document.querySelectorAll('.user-item').forEach(item => {
                    const userId = parseInt(item.dataset.userId);
                    const isOnline = data.online_users.includes(userId);
                    const statusSpan = item.querySelector('.status');
                    statusSpan.className = `status ${isOnline ? 'online' : 'offline'}`;
                    statusSpan.textContent = isOnline ? 'Online' : 'Offline';
                });
                document.getElementById('onlineCount').textContent = data.online_users.length;
            });
    }
    
    // Check for new messages every 2 seconds
    function checkNewMessages() {
        if (selectedUserId) {
            fetch(`/api/get_new_messages/?user_id=${selectedUserId}&last_id=${lastMessageId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine);
                            if (msg.id > lastMessageId) {
                                lastMessageId = msg.id;
                            }
                        });
                    }
                });
        }
    }
    
    // Send message using AJAX
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        
        if (content && selectedUserId) {
            fetch('/api/send_message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    receiver_id: selectedUserId,
                    content: content
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    input.value = '';
                    // Reload messages to show the sent message
                    loadMessages(selectedUserId);
                }
            });
        }
    }
    
    function addMessage(sender, content, timestamp, isMine) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMine ? 'mine' : 'theirs'}`;
        
        const time = new Date(timestamp).toLocaleTimeString();
        
        messageDiv.innerHTML = `
            <div class="message-content">
                <div class="message-text">${escapeHtml(content)}</div>
                <div class="message-info">
                    <span class="sender">${escapeHtml(sender)}</span>
                    <span class="time">${time}</span>
                </div>
            </div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function loadMessages(userId) {
        fetch(`/get_messages/${userId}/`)
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                
                // Update last message ID
                if (data.messages.length > 0) {
                    lastMessageId = data.messages[data.messages.length - 1].id;
                }
                
                data.messages.forEach(msg => {
                    addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine);
                });
            });
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    // Event listeners
    document.querySelectorAll('.user-item').forEach(item => {
        item.addEventListener('click', function() {
            selectedUserId = this.dataset.userId;
            const username = this.dataset.username;
            
            document.getElementById('chatHeader').innerHTML = `<h3>Chatting with ${username}</h3>`;
            document.querySelector('.message-input-area').style.display = 'flex';
            
            lastMessageId = 0;
            loadMessages(selectedUserId);
            
            document.querySelectorAll('.user-item').forEach(u => u.classList.remove('selected'));
            this.classList.add('selected');
        });
    });
    
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
    
    // Start polling
    updateOnlineStatus();
    setInterval(updateOnlineStatus, 30000); // Every 30 seconds
    setInterval(checkOnlineUsers, 5000); // Every 5 seconds
    setInterval(checkNewMessages, 2000); // Every 2 seconds
    
    // Initial load
    checkOnlineUsers();
</script>
</body>
</html>
