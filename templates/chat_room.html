<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="user-info">
                <h3>Welcome, {{ current_user.username }}</h3>
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
            <div class="users-list">
                <h4>Online Users <span class="online-count" id="onlineCount">0</span></h4>
                <div id="users">
                    {% for user in users %}
                        <div class="user-item" data-user-id="{{ user.id }}" data-username="{{ user.username }}">
                            <div class="user-avatar">{{ user.username|first|upper }}</div>
                            <div class="user-details">
                                <span class="username">{{ user.username }}</span>
                                <span class="status offline">Offline</span>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h3>Select a user to start chatting</h3>
            </div>
            <div class="messages-container" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="message-input-area" style="display: none;">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
<script>
    const currentUserId = {{ current_user.id }};
    let selectedUserId = null;
    let lastMessageId = 0;
    let messageCheckInterval = null;
    let isLoadingMessages = false;
    
    // Get CSRF token from cookies
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    // Update online status
    function updateOnlineStatus() {
        fetch('/api/update_status/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        }).catch(error => console.log('Status update error:', error));
    }
    
    // Check online users
    function checkOnlineUsers() {
        fetch('/api/check_status/')
            .then(response => response.json())
            .then(data => {
                document.querySelectorAll('.user-item').forEach(item => {
                    const userId = parseInt(item.dataset.userId);
                    const isOnline = data.online_users.includes(userId);
                    const statusSpan = item.querySelector('.status');
                    if (statusSpan) {
                        statusSpan.className = `status ${isOnline ? 'online' : 'offline'}`;
                        statusSpan.textContent = isOnline ? 'Online' : 'Offline';
                    }
                });
                const onlineCount = document.getElementById('onlineCount');
                if (onlineCount) {
                    onlineCount.textContent = data.online_users.length;
                }
            })
            .catch(error => console.log('Online users check error:', error));
    }
    
    // Check for NEW messages only
    function checkNewMessages() {
        if (selectedUserId && !isLoadingMessages && lastMessageId > 0) {
            fetch(`/api/get_new_messages/?user_id=${selectedUserId}&last_id=${lastMessageId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine, msg.id);
                            if (msg.id > lastMessageId) {
                                lastMessageId = msg.id;
                            }
                        });
                        
                        if (data.messages.length > 0) {
                            const messagesDiv = document.getElementById('messages');
                            messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        }
                    }
                })
                .catch(error => console.log('Message check error:', error));
        }
    }
    
    // Send message
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        
        if (content && selectedUserId) {
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            
            fetch('/api/send_message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    receiver_id: selectedUserId,
                    content: content
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    input.value = '';
                    // Add the sent message immediately
                    if (data.message) {
                        addMessage(data.message.sender, data.message.content, data.message.timestamp, true, data.message.id);
                        if (data.message.id > lastMessageId) {
                            lastMessageId = data.message.id;
                        }
                    }
                }
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            })
            .catch(error => {
                console.log('Send message error:', error);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send';
            });
        }
    }
    
    // Add message to chat window
    function addMessage(sender, content, timestamp, isMine, messageId = null) {
        const messagesDiv = document.getElementById('messages');
        
        // Check if message with this ID already exists
        if (messageId) {
            const existingMessage = document.querySelector(`.message[data-id="${messageId}"]`);
            if (existingMessage) {
                return; // Message already exists, don't add duplicate
            }
        }
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMine ? 'mine' : 'theirs'}`;
        if (messageId) {
            messageDiv.setAttribute('data-id', messageId);
        }
        
        const time = new Date(timestamp).toLocaleTimeString();
        
        messageDiv.innerHTML = `
            <div class="message-content">
                <div class="message-text">${escapeHtml(content)}</div>
                <div class="message-info">
                    <span class="sender">${escapeHtml(sender)}</span>
                    <span class="time">${time}</span>
                </div>
            </div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    // Load all messages for a user
    function loadMessages(userId) {
        isLoadingMessages = true;
        
        fetch(`/get_messages/${userId}/`)
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                
                lastMessageId = 0;
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine, msg.id);
                        if (msg.id > lastMessageId) {
                            lastMessageId = msg.id;
                        }
                    });
                }
                
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                isLoadingMessages = false;
            })
            .catch(error => {
                console.log('Load messages error:', error);
                isLoadingMessages = false;
            });
    }
    
    // Escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Select a user to chat with
    function selectUser(userItem) {
        selectedUserId = userItem.dataset.userId;
        const username = userItem.dataset.username;
        
        const chatHeader = document.getElementById('chatHeader');
        if (chatHeader) {
            chatHeader.innerHTML = `<h3>Chatting with ${username}</h3>`;
        }
        
        const messageInputArea = document.querySelector('.message-input-area');
        if (messageInputArea) {
            messageInputArea.style.display = 'flex';
        }
        
        // Reset last message ID and load messages
        lastMessageId = 0;
        loadMessages(selectedUserId);
        
        // Remove selected class from all users and add to current
        document.querySelectorAll('.user-item').forEach(u => u.classList.remove('selected'));
        userItem.classList.add('selected');
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
        // User selection
        document.querySelectorAll('.user-item').forEach(item => {
            item.addEventListener('click', function() {
                selectUser(this);
            });
        });
        
        // Send button
        const sendBtn = document.getElementById('sendBtn');
        if (sendBtn) {
            sendBtn.addEventListener('click', sendMessage);
        }
        
        // Enter key
        const messageInput = document.getElementById('messageInput');
        if (messageInput) {
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }
        
        // Start polling
        updateOnlineStatus();
        setInterval(updateOnlineStatus, 30000);
        setInterval(checkOnlineUsers, 5000);
        
        // Check for new messages every 2 seconds
        setInterval(() => {
            if (selectedUserId) {
                checkNewMessages();
            }
        }, 2000);
        
        checkOnlineUsers();
    });
</script>
</body>
</html>
