<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="user-info">
                <h3>Welcome, {{ current_user.username }}</h3>
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
            <div class="users-list">
                <h4>Online Users <span class="online-count" id="onlineCount">0</span></h4>
                <div id="users">
                    {% for user in users %}
                        <div class="user-item" data-user-id="{{ user.id }}" data-username="{{ user.username }}">
                            <div class="user-avatar">{{ user.username|first|upper }}</div>
                            <div class="user-details">
                                <span class="username">{{ user.username }}</span>
                                <span class="status offline">Offline</span>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <h3>Select a user to start chatting</h3>
            </div>
            <div class="messages-container" id="messages">
                <!-- Messages will appear here -->
            </div>
            <div class="message-input-area" style="display: none;">
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
    
<script>
    const currentUserId = {{ current_user.id }};
    let selectedUserId = null;
    let lastMessageId = 0;
    let isLoadingMessages = false;
    
    // Get CSRF token from cookies
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    
    // Update online status (keep user alive)
    function updateOnlineStatus() {
        fetch('/api/update_status/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            }
        }).catch(error => console.log('Status update error:', error));
    }
    
    // Check online users
    function checkOnlineUsers() {
        fetch('/api/check_status/')
            .then(response => response.json())
            .then(data => {
                document.querySelectorAll('.user-item').forEach(item => {
                    const userId = parseInt(item.dataset.userId);
                    const isOnline = data.online_users.includes(userId);
                    const statusSpan = item.querySelector('.status');
                    if (statusSpan) {
                        statusSpan.className = `status ${isOnline ? 'online' : 'offline'}`;
                        statusSpan.textContent = isOnline ? 'Online' : 'Offline';
                    }
                });
                const onlineCount = document.getElementById('onlineCount');
                if (onlineCount) {
                    onlineCount.textContent = data.online_users.length;
                }
            })
            .catch(error => console.log('Online users check error:', error));
    }
    
    // Check for NEW messages only (not all messages)
    function checkNewMessages() {
        if (selectedUserId && !isLoadingMessages) {
            fetch(`/api/get_new_messages/?user_id=${selectedUserId}&last_id=${lastMessageId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.messages && data.messages.length > 0) {
                        // Sort messages by ID
                        data.messages.sort((a, b) => a.id - b.id);
                        
                        data.messages.forEach(msg => {
                            // Only add if we haven't seen this message ID
                            if (msg.id > lastMessageId) {
                                addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine);
                                lastMessageId = msg.id;
                            }
                        });
                        
                        // Scroll to bottom only if new messages added
                        if (data.messages.length > 0) {
                            const messagesDiv = document.getElementById('messages');
                            messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        }
                    }
                })
                .catch(error => console.log('Message check error:', error));
        }
    }
    
    // Send message
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        
        if (content && selectedUserId) {
            // Disable send button briefly to prevent double sending
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            fetch('/api/send_message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    receiver_id: selectedUserId,
                    content: content
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    input.value = '';
                    // Clear the last message ID and reload messages to get the new one
                    lastMessageId = 0;
                    loadMessages(selectedUserId);
                }
                sendBtn.disabled = false;
            })
            .catch(error => {
                console.log('Send message error:', error);
                sendBtn.disabled = false;
            });
        }
    }
    
    // Track message IDs to prevent duplicates
    const displayedMessageIds = new Set();
    
    // Add message to chat window
    function addMessage(sender, content, timestamp, isMine, messageId = null) {
        // If messageId is provided and already displayed, skip
        if (messageId && displayedMessageIds.has(messageId)) {
            return;
        }
        
        if (messageId) {
            displayedMessageIds.add(messageId);
        }
        
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isMine ? 'mine' : 'theirs'}`;
        
        const time = new Date(timestamp).toLocaleTimeString();
        
        messageDiv.innerHTML = `
            <div class="message-content">
                <div class="message-text">${escapeHtml(content)}</div>
                <div class="message-info">
                    <span class="sender">${escapeHtml(sender)}</span>
                    <span class="time">${time}</span>
                </div>
            </div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    // Load all messages for a user (only called when switching users)
    function loadMessages(userId) {
        isLoadingMessages = true;
        
        fetch(`/get_messages/${userId}/`)
            .then(response => response.json())
            .then(data => {
                const messagesDiv = document.getElementById('messages');
                messagesDiv.innerHTML = '';
                
                // Clear the displayed message IDs set
                displayedMessageIds.clear();
                
                // Reset last message ID
                lastMessageId = 0;
                
                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        // Generate a temporary ID if not present
                        const msgId = msg.id || Date.now() + Math.random();
                        addMessage(msg.sender, msg.content, msg.timestamp, msg.is_mine, msgId);
                        
                        // Track the highest message ID
                        if (msg.id && msg.id > lastMessageId) {
                            lastMessageId = msg.id;
                        }
                    });
                }
                
                // Scroll to bottom
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                isLoadingMessages = false;
            })
            .catch(error => {
                console.log('Load messages error:', error);
                isLoadingMessages = false;
            });
    }
    
    // Escape HTML to prevent XSS
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Select a user to chat with
    function selectUser(userItem) {
        selectedUserId = userItem.dataset.userId;
        const username = userItem.dataset.username;
        
        const chatHeader = document.getElementById('chatHeader');
        if (chatHeader) {
            chatHeader.innerHTML = `<h3>Chatting with ${username}</h3>`;
        }
        
        const messageInputArea = document.querySelector('.message-input-area');
        if (messageInputArea) {
            messageInputArea.style.display = 'flex';
        }
        
        // Reset and load messages for new user
        lastMessageId = 0;
        displayedMessageIds.clear();
        loadMessages(selectedUserId);
        
        // Remove selected class from all users and add to current
        document.querySelectorAll('.user-item').forEach(u => u.classList.remove('selected'));
        userItem.classList.add('selected');
    }
    
    // Clear duplicate messages function
    function clearDuplicates() {
        const messages = document.querySelectorAll('.message');
        const seen = new Set();
        
        messages.forEach(msg => {
            const text = msg.querySelector('.message-text')?.innerText;
            if (text && seen.has(text)) {
                msg.remove();
            } else if (text) {
                seen.add(text);
            }
        });
    }
    
    // Event listeners when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
        // User selection
        document.querySelectorAll('.user-item').forEach(item => {
            item.addEventListener('click', function() {
                selectUser(this);
            });
        });
        
        // Send button
        const sendBtn = document.getElementById('sendBtn');
        if (sendBtn) {
            sendBtn.addEventListener('click', sendMessage);
        }
        
        // Enter key
        const messageInput = document.getElementById('messageInput');
        if (messageInput) {
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }
        
        // Start polling intervals
        updateOnlineStatus();
        
        // Update online status every 10 seconds
        setInterval(updateOnlineStatus, 10000);
        
        // Check online users every 5 seconds
        setInterval(checkOnlineUsers, 5000);
        
        // Check for new messages every 2 seconds (only if a user is selected)
        setInterval(() => {
            if (selectedUserId) {
                checkNewMessages();
            }
        }, 2000);
        
        // Initial load of online users
        checkOnlineUsers();

    const existingMessages = document.querySelectorAll('.message');

    existingMessages.forEach(msg => {

        const msgText = msg.querySelector('.message-text')?.innerText;

    if (isDuplicate) {

    if (messageId && displayedMessageIds.has(messageId)) {

    }
    
    if (messageId) {

    }
    
    const messagesDiv = document.getElementById('messages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isMine ? 'mine' : 'theirs'}`;
    
    const time = new Date(timestamp).toLocaleTimeString();
    
    messageDiv.innerHTML = `
        <div class="message-content">
            <div class="message-text">${escapeHtml(content)}</div>
            <div class="message-info">
                <span class="sender">${escapeHtml(sender)}</span>

    });
</script>
</body>
</html>
